name: shawan_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.2+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_auth: ^6.4.0
  google_fonts: ^8.0.2
  intl: ^0.20.2
  shimmer: ^3.0.0
  image_picker: ^1.2.1
  camera: ^0.11.0+2
  path_provider: ^2.1.5
  path: ^1.9.0
  image: ^4.8.0
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  http: ^1.4.0
  pdf: ^3.10.8
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

